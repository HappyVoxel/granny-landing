# Serves the static export. Next.js names every file under /_next/static/ by its
# content hash, so those can be cached for good; HTML must be checked every time
# or a deploy stays invisible until the cache expires.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The static export uses trailing slashes, so try_files' `$uri/` fallback
    # redirects a slash-less path to the directory form. Keep that Location
    # relative: an absolute redirect would carry this container's internal
    # port (8080) and the public proxy cannot serve it.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Markdown for humans and agents: render it, do not download it.
    location ~* \.md$ {
        types {
            text/markdown md markdown;
        }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
